<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
    }
    .section {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #0066cc;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #reportBtn {
      background-color: #0066cc;
      color: white;
    }
    #reportBtn:hover:not(:disabled) {
      background-color: #0052a3;
    }
    #reportBtn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    #status.success {
      display: block;
      background-color: #e6f4ea;
      color: #1e7e34;
    }
    #status.error {
      display: block;
      background-color: #fce8e6;
      color: #c5221f;
    }
    #status.loading {
      display: block;
      background-color: #e8f0fe;
      color: #1967d2;
    }
    .settings-link {
      margin-top: 12px;
      text-align: center;
    }
    .settings-link a {
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }
    .settings-link a:hover {
      text-decoration: underline;
    }
    .settings-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .settings-panel.show {
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0066cc;
    }
    .btn-secondary {
      background-color: #f1f3f4;
      color: #1a1a1a;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background-color: #e8eaed;
    }
  </style>
</head>
<body>
  <h1>
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#0066cc" stroke-width="2"/>
      <path d="M12 8v4M12 16h.01" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Bug Reporter
  </h1>

  <div class="section">
    <label for="userNote">What went wrong? (optional)</label>
    <textarea id="userNote" placeholder="Describe the issue..."></textarea>
  </div>

  <button id="reportBtn">Report Bug</button>

  <div id="status"></div>

  <div class="settings-link">
    <a href="#" id="toggleSettings">Settings</a>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="section">
      <label for="apiUrl">API URL</label>
      <input type="text" id="apiUrl" placeholder="https://your-app.up.railway.app">
    </div>
    <div class="section">
      <label for="apiKey">API Key</label>
      <input type="text" id="apiKey" placeholder="your-api-key">
    </div>
    <button class="btn-secondary" id="saveSettings">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
